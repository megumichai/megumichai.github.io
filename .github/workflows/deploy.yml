name: Deploy to GitHub Pages

on:
  # Publish on every push to the default branch …
  push:
    branches: [main]
  # … and allow a manual run from the Actions tab.
  workflow_dispatch:

# Allow the job to read the repo and publish a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deployment finish instead of cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      # Detects pnpm from pnpm-lock.yaml, runs `pnpm build`, and uploads the
      # resulting ./dist as the Pages artifact.
      - name: Install, build, and upload your site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
